<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Nakuru Youth Tech Expo</title>

  <!-- All three pages share the same stylesheet and script. -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <a href="index.html">Nakuru Youth Tech Expo</a>

    <!-- JavaScript shows the Menu button on mobile. Without JavaScript,
         the navigation links stay visible. -->
    <button
      class="menu-toggle"
      type="button"
      aria-controls="main-nav"
      aria-expanded="false"
      hidden
    >
      Menu
    </button>

    <!-- Keep the same link order on every page and mark the current page. -->
    <nav id="main-nav" aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="programme.html">Programme</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="expo-heading">
      <h1 id="expo-heading">Nakuru Youth Tech Expo</h1>
      <p>Explore technology and career opportunities at our one-day youth expo.</p>
      <p><time datetime="2026-12-05">Saturday, 5 December 2026</time></p>

      <!-- The shared script fills in and reveals the countdown. -->
      <p id="expo-countdown" hidden></p>

      <a href="programme.html">View the programme</a>
    </section>
  </main>

  <footer>
    <p>Nakuru Youth Tech Expo · Group A course project</p>
  </footer>
</body>
</html>
